<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <!-- Google Fonts: Bungee & Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/src/logo.png">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

{% include navbar.html %}

  <hr class="border-secondary opacity-50 my-0">

{{ content }}

  <hr class="border-secondary opacity-50 my-0">

  <footer class="container-fluid py-4 bg-dark text-light text-center">
    <p class="mb-2">
      <a href="https://github.com/berkecuhadar" target="_blank" rel="noopener" class="text-reset text-decoration-none fs-5"
        aria-label="GitHub"><i class="bi bi-github"></i></a>
    </p>
    <p class="mb-0">&copy; <span id="current-year"></span> Berke Cuhadar</p>
  </footer>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
